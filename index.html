<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceTracker</title>
    <meta name="description" content="Personal finance tracker with Telegram integration, debt payoff planning, and financial management." />
    <meta property="og:title" content="FinanceTracker" />
    <meta property="og:description" content="Personal finance tracker with Telegram integration, debt payoff planning, and financial management." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      localStorage.removeItem('design_system');
      document.documentElement.classList.remove('design-monochrome');
      if (localStorage.getItem('liquid_glass') !== 'false') {
        document.documentElement.classList.add('liquid-glass-enabled');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
